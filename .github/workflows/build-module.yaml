name: Build Module (Zygisk)

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:
    name: Gradle Automation Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: "temurin"

      - name: Setup Android SDK components
        # The vendored :runtime module compiles native code with the NDK.
        # NOTE: do NOT pipe `yes |` into sdkmanager here: Actions' default
        # bash runs with `pipefail`, and the SIGPIPE death of `yes` fails
        # the whole step. Licenses are pre-accepted on hosted runners.
        shell: bash
        run: |
          SDKMANAGER="$(find "${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools" -name sdkmanager | head -1)"
          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager not found under ANDROID_HOME" >&2
            exit 1
          fi
          "$SDKMANAGER" --install "platforms;android-34" "ndk;26.1.10909125" "cmake;3.22.1" > /dev/null

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-home-cache-cleanup: true

      - name: Build with Gradle (Zygisk only)
        run: ./gradlew module:assembleZygisk

      - name: Prepare artifact
        if: success()
        id: prepareArtifact
        run: |
          zygiskReleaseName=`ls module/build/outputs/magisk/zygisk/release/*.zip | awk -F '(/|.zip)' '{print $7}'` && echo "zygiskReleaseName=$zygiskReleaseName-release" >> $GITHUB_OUTPUT
          zygiskDebugName=`ls module/build/outputs/magisk/zygisk/debug/*.zip | awk -F '(/|.zip)' '{print $7}'` && echo "zygiskDebugName=$zygiskDebugName-debug" >> $GITHUB_OUTPUT

      - name: Upload zygisk release
        # Upload the module zip itself (not its unpacked contents:
        # upload-artifact v4 drops hidden files like packages/.android
        # when the paths are globbed from a directory).
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.prepareArtifact.outputs.zygiskReleaseName }}
          path: "module/build/outputs/magisk/zygisk/release/*.zip"

      - name: Upload zygisk debug
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.prepareArtifact.outputs.zygiskDebugName }}
          path: "module/build/outputs/magisk/zygisk/debug/*.zip"
